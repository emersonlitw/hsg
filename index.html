.iso-svg{display:block;width:100%;height:auto;overflow:visible}

.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}

*{box-sizing:border-box}

@media (max-width:560px){.ic-bar{gap:6px}.ic-restart{padding:0 6px;gap:2px}.ic-steps{gap:3px}.ic-step .ic-name{display:none}.ic-step{min-height:40px}.iso-page{margin:24px auto 48px}.iso-plate .iso-svg{width:116%;margin-left:-8%}.iso-plate{overflow:hidden}}</style></head><body class="iso" data-theme="light"><script>try{var q=matchMedia("(prefers-color-scheme: dark)");var f=function(){document.body.dataset.theme=q.matches?"dark":"light"};f();q.addEventListener("change",f)}catch(e){}</script><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">圖 1</span><span class="iso-plate-corner" data-corner="title">HSG</span><span class="iso-plate-corner" data-corner="hint">點按 · 拖曳</span><span class="iso-plate-corner" data-corner="readout" data-readout>6/6 拍片結束 · X 光 3/3</span></div><div class="ic-stage" tabindex="0" role="group" aria-roledescription="分步圖解" aria-label="子宮輸卵管攝影六個步驟。左右方向鍵切換步驟，空白鍵播放或暫停。"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 400" role="img" aria-label="子宮輸卵管攝影（HSG）的示意圖：子宮、子宮頸、兩側輸卵管與卵巢以冠狀切面（從正面）剖半，平放、切面朝上；子宮底在遠端，子宮頸靠近觀看者，切面上可看到倒三角形的子宮腔、一層內膜、肌肉層與窄縫狀的子宮頸管；兩側輸卵管從子宮角穿過子宮壁往左右延伸，由細的峽部變成較粗的壺腹部，末端流蘇狀的繖部彎向旁邊的卵巢（卵巢為示意）。一支細的水球導管從靠近觀看者的一側穿過子宮頸管，前端的小水球在子宮頸內口正上方撐開；導管外露的長度以斷開符號縮短，尾端的管座接著一支注射筒。剖面圖右下方有一台站立的小 X 光螢幕，暗底、顯影劑顯示為白色。6 個步驟：1 放入導管，水球慢慢撐開；2 推注射筒，顯影劑沿著導管前進到導管前端；3 顯影劑從導管前端流出，先往上充滿子宮腔、再填到水球旁，呈倒三角形，螢幕柔和閃一下，顯示第 1 張 X 光片（子宮腔與導管）；4 顯影劑同時沿兩側輸卵管由內往外流，拍第 2 張（加上兩側輸卵管）；5 顯影劑從兩側輸卵管末端流出、在腹腔呈羽毛狀散開，拍第 3 張（加上兩側流出的顯影劑）；6 水球縮小，導管與注射筒一起退出，子宮腔與輸卵管內的顯影劑慢慢變淡，腹腔的顯影劑再散開變淡，螢幕維持第 3 張。"><desc>子宮輸卵管攝影（HSG）互動圖解 v8。作者：李日升醫師（Dr. EmersonLi）；© 2026 李日升醫師，CC BY-NC-ND 4.0。https://emersonlitw.github.io/hsg/</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>子宮輸卵管攝影（HSG） v8</dc:title><dc:creator><cc:Agent><dc:title>李日升
